[package]
name = "deepseek-harness-lite"
version = "0.1.0"
edition = "2021"
description = "Lightweight embedded agent harness for network element devices"
license = "MIT"

[[bin]]
name = "dsh-lite"
path = "src/main.rs"

[dependencies]
# Async runtime — single-thread to minimize memory footprint
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "io-util", "fs", "sync", "time", "signal"] }

# HTTP server + client (shared, no reqwest/axum)
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Stream extensions (for BodyDataStream .next() + SSE stream)
tokio-stream = "0.1"

# Async stream macro (for SSE body construction)
async-stream = "0.3"

# Config (TOML)
toml = "0.8"

# Skill YAML frontmatter
yaml-rust2 = "0.10"

# SSH client (pure Rust, placeholder for P7)
russh = "0.50"

# Persistence encoding (compact binary)
bincode = "1"

# Logging (minimal, not tracing)
log = "0.4"
env_logger = "0.11"
chrono = "0.4"

[profile.release]
# Optimize for binary size and memory footprint
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
