# DeepSeek Harness Lite — Default Configuration

[model]
# Local inference service (OpenAI-compatible /v1/chat/completions)
# The agent acts as an HTTP client to this endpoint.
base_url = "http://127.0.0.1:8080/v1"
api_key = ""
model = "deepseek-v4-lite"
# Context window in tokens (drives compaction threshold)
context_window = 8192
# Max output tokens per request
max_tokens = 2048
# Temperature (0 = deterministic, higher = creative)
temperature = 0.0

[server]
# Built-in HTTP server + static web client
listen = "127.0.0.1:3080"

[session]
# Flash persistence directory for session checkpoints
persist_dir = ".sessions"
# Checkpoint frequency: save to flash every N events
checkpoint_events = 50
# Also checkpoint at turn boundaries
checkpoint_turn_end = true

[memory]
# Long-term memory backend: flash (default) | custom
backend = "flash"
# Memory storage path
path = ".sessions/memory.bin"
# Maximum entries before LRU eviction
max_entries = 256

[compaction]
# Trigger compaction when derived messages exceed this fraction of context_window
threshold = 0.7
# Keep recent K turns as raw, summarize older
keep_recent_turns = 4

[skill]
# Directory to scan for skill files (YAML frontmatter + Markdown)
dir = "skills"

[trajectory]
# Record full event trajectory (turn/step/chunk/tool timing).
# Default off to save memory; enable to widen memory budget.
enabled = false

[tools]
# Built-in tools enabled by default; skills may restrict via `tools.allow`
shell = true
file_read = true
file_write = true
file_search = true
ssh_exec = false    # placeholder, enable after P7
memory = true
todo = true
