<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek Harness Lite</title>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --surface-light: #1a2745;
  --border: #2a3a5e;
  --text: #e0e0e8;
  --text-dim: #8888a0;
  --accent: #0f8b8d;
  --accent-light: #16a3a5;
  --user-bubble: #1e3a5f;
  --assistant-bubble: #1e2d4a;
  --error: #e74c3c;
  --tool: #f39c12;
  --radius: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; }

/* Sidebar */
.sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
.sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 14px; color: var(--accent-light); }
.sidebar-header span { color: var(--text-dim); font-size: 11px; font-weight: 400; }
.session-list { flex: 1; overflow-y: auto; padding: 8px; }
.session-item { padding: 10px 12px; border-radius: var(--radius); cursor: pointer; margin-bottom: 4px; font-size: 13px; transition: background 0.15s; }
.session-item:hover { background: var(--surface-light); }
.session-item.active { background: var(--accent); color: white; }
.session-item .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session-item .meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.session-item.active .meta { color: rgba(255,255,255,0.7); }
.btn-new-session { margin: 8px; padding: 10px; background: var(--accent); color: white; border: none; border-radius: var(--radius); cursor: pointer; font-size: 13px; text-align: center; }
.btn-new-session:hover { background: var(--accent-light); }

/* Main area */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.header { padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 15px; font-weight: 600; color: var(--text); }
.header h1 span { color: var(--text-dim); font-size: 12px; font-weight: 400; }
.header-controls { display: flex; align-items: center; gap: 12px; }
.skill-select { background: var(--surface-light); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font-size: 12px; }
.toggle-label { font-size: 12px; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; gap: 6px; }
.toggle-label input { accent-color: var(--accent); }

/* Chat */
.chat-area { flex: 1; overflow-y: auto; padding: 20px; }
.message { max-width: 800px; margin: 0 auto 16px; }
.message.user .bubble { background: var(--user-bubble); margin-left: 40px; }
.message.assistant .bubble { background: var(--assistant-bubble); margin-right: 40px; }
.bubble { padding: 12px 16px; border-radius: var(--radius); font-size: 14px; line-height: 1.6; word-break: break-word; }
.bubble pre { background: #0d1117; padding: 10px; border-radius: 6px; overflow-x: auto; margin: 8px 0; font-size: 12px; }
.bubble code { font-family: "Cascadia Code", "Fira Code", Consolas, monospace; font-size: 13px; }
.bubble p { margin: 6px 0; }
.bubble ul, .bubble ol { margin: 6px 0 6px 20px; }
.bubble h1, .bubble h2, .bubble h3 { margin: 10px 0 6px; }
.bubble h1 { font-size: 18px; } .bubble h2 { font-size: 16px; } .bubble h3 { font-size: 14px; }
.bubble strong { color: var(--accent-light); }
.message.assistant .role-tag { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
.tool-event { max-width: 800px; margin: 0 auto 8px; font-size: 12px; color: var(--tool); padding: 4px 12px; border-left: 3px solid var(--tool); background: rgba(243,156,18,0.05); border-radius: 0 4px 4px 0; }
.tool-event.error { color: var(--error); border-left-color: var(--error); background: rgba(231,76,60,0.05); }
.tool-event .label { font-weight: 600; }
.tool-event pre { margin: 4px 0; white-space: pre-wrap; font-size: 11px; color: var(--text-dim); max-height: 200px; overflow-y: auto; }
.trajectory-event { font-size: 11px; color: var(--text-dim); padding: 2px 12px; max-width: 800px; margin: 0 auto 4px; }
.typing { display: inline-block; animation: blink 1s infinite; }
@keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }

/* Input */
.input-area { padding: 16px 20px; background: var(--surface); border-top: 1px solid var(--border); }
.input-row { max-width: 800px; margin: 0 auto; display: flex; gap: 10px; }
.input-row textarea { flex: 1; background: var(--surface-light); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; font-size: 14px; font-family: inherit; resize: none; height: 44px; max-height: 120px; transition: height 0.1s; }
.input-row textarea:focus { outline: none; border-color: var(--accent); }
.input-row button { background: var(--accent); color: white; border: none; border-radius: var(--radius); padding: 0 20px; font-size: 14px; cursor: pointer; white-space: nowrap; }
.input-row button:hover { background: var(--accent-light); }
.input-row button:disabled { opacity: 0.5; cursor: not-allowed; }
.empty-state { text-align: center; color: var(--text-dim); padding: 60px 20px; }
.empty-state h2 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
.empty-state p { font-size: 13px; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-header">Sessions <span id="session-count"></span></div>
  <div class="session-list" id="session-list"></div>
  <button class="btn-new-session" onclick="createSession()">+ New Session</button>
</div>
<div class="main">
  <div class="header">
    <h1>DeepSeek Harness Lite <span id="status-text"></span></h1>
    <div class="header-controls">
      <select class="skill-select" id="skill-select" onchange="switchSkill()"></select>
      <label class="toggle-label"><input type="checkbox" id="show-trajectory"> Trajectory</label>
    </div>
  </div>
  <div class="chat-area" id="chat-area">
    <div class="empty-state">
      <h2>Ready</h2>
      <p>Send a message to start a conversation.</p>
    </div>
  </div>
  <div class="input-area">
    <div class="input-row">
      <textarea id="input" placeholder="Send a message..." onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script>
let isStreaming = false;
let currentAssistantEl = null;
let currentAssistantText = '';

// ─── Session management ────────────────────────────────────────────────
async function loadSessions() {
  const res = await fetch('/api/sessions');
  const sessions = await res.json();
  const list = document.getElementById('session-list');
  list.innerHTML = '';
  document.getElementById('session-count').textContent = `(${sessions.length})`;
  sessions.forEach(s => {
    const el = document.createElement('div');
    el.className = 'session-item' + (s.in_memory ? ' active' : '');
    el.innerHTML = `<div class="title">${escHtml(s.title)}</div><div class="meta">${s.event_count} events</div>`;
    el.onclick = () => switchSession(s.id);
    list.appendChild(el);
  });
}

async function createSession() {
  await fetch('/api/sessions/create', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({title: 'New session'})
  });
  loadSessions();
}

async function switchSession(id) {
  await fetch('/api/sessions/switch', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({id})
  });
  loadSessions();
}

// ─── Skills ────────────────────────────────────────────────────────────
async function loadSkills() {
  const res = await fetch('/api/skills');
  const skills = await res.json();
  const sel = document.getElementById('skill-select');
  sel.innerHTML = '';
  skills.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.name;
    opt.textContent = `${s.name} (${s.mode}${s.think ? '+think' : ''})`;
    sel.appendChild(opt);
  });
}

function switchSkill() {
  // For P6, skill switching is client-side only (server uses active_skill_name).
  // Full server-side skill switching arrives in P7.
}

// ─── Chat ──────────────────────────────────────────────────────────────
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
function autoResize(el) { el.style.height = '44px'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }

async function sendMessage() {
  const input = document.getElementById('input');
  const msg = input.value.trim();
  if (!msg || isStreaming) return;

  // Clear empty state.
  const chat = document.getElementById('chat-area');
  const empty = chat.querySelector('.empty-state');
  if (empty) empty.remove();

  // Add user message.
  addMessage('user', msg);
  input.value = '';
  input.style.height = '44px';

  isStreaming = true;
  document.getElementById('send-btn').disabled = true;
  document.getElementById('status-text').textContent = '— thinking...';

  // Start SSE stream.
  const res = await fetch('/api/chat', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({message: msg})
  });

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  const showTraj = document.getElementById('show-trajectory').checked;

  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, {stream: true});
    const lines = buffer.split('\n');
    buffer = lines.pop();
    for (const line of lines) {
      if (!line.startsWith('data: ')) continue;
      const data = line.slice(6);
      if (data === '[DONE]') continue;
      try { handleEvent(JSON.parse(data), showTraj); } catch(e) {}
    }
  }

  // Finalize.
  if (currentAssistantEl && currentAssistantText) {
    currentAssistantEl.querySelector('.bubble').innerHTML = renderMarkdown(currentAssistantText);
  }
  isStreaming = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('status-text').textContent = '';
  loadSessions();
}

function handleEvent(event, showTraj) {
  const chat = document.getElementById('chat-area');

  switch (event.type) {
    case 'delta':
      if (!currentAssistantEl) {
        currentAssistantEl = addMessage('assistant', '');
        currentAssistantText = '';
      }
      currentAssistantText += event.text;
      currentAssistantEl.querySelector('.bubble').innerHTML = renderMarkdown(currentAssistantText) + '<span class="typing">▋</span>';
      chat.scrollTop = chat.scrollHeight;
      break;

    case 'assistant_message':
      if (!currentAssistantEl) {
        currentAssistantEl = addMessage('assistant', '');
      }
      if (event.content) {
        currentAssistantText = event.content;
        currentAssistantEl.querySelector('.bubble').innerHTML = renderMarkdown(event.content);
      }
      if (event.tool_calls && event.tool_calls.length > 0) {
        event.tool_calls.forEach(tc => {
          addToolEvent(`Tool call: ${tc.name}`, JSON.stringify(tc.arguments, null, 2), false, showTraj);
        });
      }
      chat.scrollTop = chat.scrollHeight;
      break;

    case 'tool_call':
      addToolEvent(`Executing: ${event.name}`, JSON.stringify(event.arguments, null, 2), false, showTraj);
      break;

    case 'tool_result':
      addToolEvent(`Result`, event.content, event.is_error, showTraj);
      break;

    case 'turn_start':
      currentAssistantEl = null;
      currentAssistantText = '';
      if (showTraj) addTrajectory(`── Turn ${event.turn} started ──`);
      break;

    case 'step_start':
      if (showTraj) addTrajectory(`  Step ${event.turn}.${event.step}`);
      break;

    case 'step_end':
      if (showTraj) addTrajectory(`  Step ${event.turn}.${event.step} ended`);
      break;

    case 'turn_end':
      if (showTraj) addTrajectory(`── Turn ended: ${event.reason} ──`);
      currentAssistantEl = null;
      break;

    case 'error':
      addToolEvent(`Error`, event.message, true, true);
      break;
  }
}

// ─── DOM helpers ───────────────────────────────────────────────────────
function addMessage(role, content) {
  const chat = document.getElementById('chat-area');
  const el = document.createElement('div');
  el.className = `message ${role}`;
  if (role === 'assistant') {
    el.innerHTML = '<div class="role-tag">Assistant</div><div class="bubble"></div>';
  } else {
    el.innerHTML = '<div class="bubble"></div>';
  }
  el.querySelector('.bubble').innerHTML = role === 'user' ? escHtml(content) : renderMarkdown(content);
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

function addToolEvent(label, content, isError, showTraj) {
  if (!showTraj && !isError) return;
  const chat = document.getElementById('chat-area');
  const el = document.createElement('div');
  el.className = 'tool-event' + (isError ? ' error' : '');
  el.innerHTML = `<span class="label">${escHtml(label)}</span>${content ? '<pre>' + escHtml(content) + '</pre>' : ''}`;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}

function addTrajectory(text) {
  const chat = document.getElementById('chat-area');
  const el = document.createElement('div');
  el.className = 'trajectory-event';
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
}

// ─── Minimal markdown renderer ─────────────────────────────────────────
function renderMarkdown(md) {
  if (!md) return '';
  let html = escHtml(md);
  // Code blocks
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => `<pre><code>${code}</code></pre>`);
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Headers
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // Lists
  html = html.replace(/^\- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // Paragraphs
  html = html.replace(/\n\n/g, '</p><p>');
  html = '<p>' + html + '</p>';
  // Clean up empty paragraphs
  html = html.replace(/<p>\s*<\/p>/g, '');
  // Don't wrap pre in p
  html = html.replace(/<p>(<pre>)/g, '$1').replace(/(<\/pre>)<\/p>/g, '$1');
  return html;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Init ──────────────────────────────────────────────────────────────
loadSessions();
loadSkills();
</script>
</body>
</html>
